<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community Relief Fund - Donation Lab</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f6f8; }
    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 360px; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #status { margin-top: 16px; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Make a Donation</h2>
    <div class="field">
      <label for="name">Donor Name</label>
      <input type="text" id="name" placeholder="Full Name" />
    </div>
    <div class="field">
      <label for="amount">Amount ($)</label>
      <input type="number" id="amount" placeholder="50" />
    </div>
    <button id="donateBtn">Donate Now</button>
    <div id="status"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
